# Main context (this is the global configuration)
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;

    # Upstream block to define the Node.js backend servers
    upstream nodejs_cluster_least_conn {
        least_conn;
        server app1:8001;
        server app2:8002;
        server app3:8003;
    }

    upstream nodejs_cluster_round_robin {
        server app1:8001;
        server app2:8002;
        server app3:8003;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certificates/nginx-selfsigned.crt;
        ssl_certificate_key /etc/nginx/certificates/nginx-selfsigned.key;

        location / {
            proxy_pass http://nodejs_cluster_round_robin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
      listen 8080;
      server_name localhost;

      location / {
        return 301 https://$host$request_uri;
      }
    }

    server {
      listen 80;
      server_name localhost;

      location / {
        return 301 https://$host$request_uri;
      }
    }
}
