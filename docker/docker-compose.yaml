version: '3'
services:
  nginx-server:
    image: nginx
    ports:
      - "8080:8080"
    # environment:
    #   - NGINX_HOST=foobar.com
    #   - NGINX_PORT=80
    volumes:
      - ../nginx/templates:/etc/nginx/templates
      - ../nginx/proxy_server/nginx.conf:/etc/nginx/nginx.conf
      - ../nginx/logs/error.log:/var/log/nginx/error.log
      - ../nginx/logs/access.log:/var/log/nginx/access.log
    networks:
      - nodejs_cluster_network
  app1:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    environment:
      - APP_NAME=App1
      - PORT=8001
    # ports:
    #   - 3001:8001
    depends_on:
      - nginx-server
    networks:
      - nodejs_cluster_network
  app2:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    environment:
      - APP_NAME=App2
      - PORT=8002
    # ports:
    #   - 3002:8002
    depends_on:
      - nginx-server
    networks:
      - nodejs_cluster_network
  app3:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    environment:
      - APP_NAME=App3
      - PORT=8003
    # ports:
    #   - 3003:8003
    depends_on:
      - nginx-server
    networks:
      - nodejs_cluster_network
networks:
  nodejs_cluster_network:
    driver: bridge